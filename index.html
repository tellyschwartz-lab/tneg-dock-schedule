<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNEG Dock Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:      #1B2A4A;
    --blue:      #1E6CB8;
    --lightblue: #D6E4F7;
    --white:     #FFFFFF;
    --black:     #1A1A1A;
    --gray:      #808080;
    --inbound-bg:    #1E6CB8;
    --inbound-dark:  #0d3d6e;
    --outbound-bg:   #1e8c4a;
    --outbound-dark: #0d4a25;
    --cancelled-bg:  #c0392b;
    --cell-empty:    #f4f7fb;
    --cell-border:   #dde6f0;
    --hour-border:   #b0c4d8;
    --pending-bg:    rgba(255,255,255,0.15);
    --pending-text:  rgba(255,255,255,0.75);
    --inprogress-bg: #f39c12;
    --inprogress-text: #7a4e00;
    --completed-bg:  #27ae60;
    --completed-text: #0d3d1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Barlow', Arial, sans-serif;
    background: var(--navy);
    color: var(--black);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    background: var(--navy);
    padding: 0 24px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--blue);
    flex-shrink: 0;
  }
  #header-left { display: flex; align-items: center; gap: 20px; }
  #logo-area { display: flex; align-items: center; gap: 12px; }
  #logo-img { height: 38px; width: auto; filter: brightness(0) invert(1); }
  #logo-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.2); }
  #app-title {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--white);
  }
  #app-subtitle {
    font-size: 11px;
    color: var(--lightblue);
    letter-spacing: 0.5px;
    margin-top: 2px;
    text-transform: uppercase;
    font-weight: 500;
  }
  #date-display {
    background: rgba(30,108,184,0.25);
    border: 1px solid rgba(30,108,184,0.5);
    border-radius: 4px;
    padding: 6px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--lightblue);
    letter-spacing: 0.3px;
  }
  #header-right { display: flex; align-items: center; gap: 24px; }
  #legend { display: flex; gap: 16px; align-items: center; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .legend-dot { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; }
  .dot-inbound   { background: var(--inbound-bg); }
  .dot-outbound  { background: var(--outbound-bg); }
  .dot-cancelled { background: var(--cancelled-bg); }
  .dot-open      { background: var(--cell-empty); border: 1px solid var(--cell-border); }
  .legend-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 4px; }
  #last-updated { font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 500; }
  #status-bar { height: 2px; background: var(--blue); width: 0%; transition: width 0.4s ease; flex-shrink: 0; }
  #grid-outer { flex: 1; overflow: auto; background: var(--white); }
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  .col-time { width: 80px; }
  .col-door { width: 150px; min-width: 125px; }
  thead tr th {
    background: var(--navy);
    color: var(--lightblue);
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    padding: 11px 6px;
    border: 1px solid rgba(255,255,255,0.07);
    position: sticky;
    top: 0;
    z-index: 10;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  thead tr th.col-time {
    text-align: left;
    padding-left: 14px;
    position: sticky;
    left: 0;
    z-index: 20;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
  }
  tbody tr td {
    border: 1px solid var(--cell-border);
    vertical-align: top;
    padding: 2px;
    height: 42px;
    background: var(--cell-empty);
  }
  td.time-label {
    background: var(--navy);
    color: rgba(214,228,247,0.55);
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 0 12px;
    vertical-align: middle;
    white-space: nowrap;
    position: sticky;
    left: 0;
    z-index: 5;
    border-right: 3px solid var(--blue);
    border-top: 1px solid rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    letter-spacing: 0.5px;
  }
  tr.hour-mark td { border-top: 2px solid var(--hour-border); }
  tr.hour-mark td.time-label {
    border-top: 2px solid var(--blue);
    color: var(--lightblue);
    font-size: 15px;
    font-weight: 800;
  }
  .appt {
    border-radius: 3px;
    padding: 4px 8px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .appt-inbound  { background: var(--inbound-bg);  border-left: 5px solid var(--inbound-dark); }
  .appt-outbound { background: var(--outbound-bg); border-left: 5px solid var(--outbound-dark); }
  .appt-cancelled { background: var(--cancelled-bg); border-left: 5px solid #922b21; opacity: 0.85; }
  .appt-dir {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 1px;
    color: rgba(255,255,255,0.75);
  }
  .appt-carrier {
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }
  .appt-partner {
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
  /* Status badge */
  .appt-status {
    display: inline-block;
    margin-top: 3px;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    width: fit-content;
  }
  .status-pending {
    background: var(--pending-bg);
    color: var(--pending-text);
    border: 1px solid rgba(255,255,255,0.25);
  }
  .status-inprogress {
    background: var(--inprogress-bg);
    color: var(--inprogress-text);
  }
  .status-completed {
    background: var(--completed-bg);
    color: var(--completed-text);
  }
  /* Status indicator strip on continuation cells */
  .cont-pending    { opacity: 0.85; }
  .cont-inprogress { background-image: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(243,156,18,0.25) 6px, rgba(243,156,18,0.25) 12px); }
  .cont-completed  { background-image: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(39,174,96,0.25) 6px, rgba(39,174,96,0.25) 12px); }
  #loading {
    position: fixed;
    inset: 0;
    background: var(--navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #loading-logo { height: 55px; filter: brightness(0) invert(1); margin-bottom: 32px; opacity: 0.9; }
  .spinner {
    width: 34px;
    height: 34px;
    border: 3px solid rgba(30,108,184,0.25);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: rgba(214,228,247,0.5); font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  #error-msg {
    display: none;
    position: fixed;
    top: 74px;
    left: 50%;
    transform: translateX(-50%);
    background: #922b21;
    border: 1px solid #c0392b;
    color: #fff;
    padding: 10px 24px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    z-index: 50;
  }
</style>
</head>
<body>

<div id="loading">
  <img id="loading-logo" src="./The_Northeast_Group_Logo_Rev1-18.jpg" alt="TNEG" onerror="this.style.display='none'">
  <div class="spinner"></div>
  <p>Loading today's schedule</p>
</div>

<div id="error-msg"></div>

<div id="header">
  <div id="header-left">
    <div id="logo-area">
      <img id="logo-img" src="./The_Northeast_Group_Logo_Rev1-18.jpg" alt="The Northeast Group" onerror="this.style.display='none'">
      <div id="logo-divider"></div>
      <div>
        <div id="app-title">Dock Schedule</div>
        <div id="app-subtitle">Live &bull; Auto-refresh every 60s</div>
      </div>
    </div>
    <div id="date-display">Loading...</div>
  </div>
  <div id="header-right">
    <div id="legend">
      <div class="legend-item"><div class="legend-dot dot-inbound"></div>Inbound</div>
      <div class="legend-item"><div class="legend-dot dot-outbound"></div>Outbound</div>
      <div class="legend-item"><div class="legend-dot dot-cancelled"></div>Cancelled</div>
      <div class="legend-item"><div class="legend-dot dot-open"></div>Open</div>
      <div class="legend-divider"></div>
      <div class="legend-item">
        <div class="legend-dot" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);"></div>Pending
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#f39c12;"></div>In Progress
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#27ae60;"></div>Completed
      </div>
    </div>
    <div id="last-updated">—</div>
  </div>
</div>
<div id="status-bar"></div>

<div id="grid-outer">
  <table id="schedule-table">
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
const SHEET_ID   = "1eZvGNNhhywAI-zlx8uJcI2IfThvf7txndT5q8FIbdrI";
const REFRESH_MS = 60000;
const DOORS = ["Door 1","Door 2","Door 3","Door 4","Door 5","Door 6","Door 7","Door 8","Door 9","Door 10","Door 11","Door 12"];
const SLOTS = [
  {id:1,text:"08:00"},{id:2,text:"08:15"},{id:3,text:"08:30"},{id:4,text:"08:45"},
  {id:5,text:"09:00"},{id:6,text:"09:15"},{id:7,text:"09:30"},{id:8,text:"09:45"},
  {id:9,text:"10:00"},{id:10,text:"10:15"},{id:11,text:"10:30"},{id:12,text:"10:45"},
  {id:13,text:"11:00"},{id:14,text:"11:15"},{id:15,text:"11:30"},{id:16,text:"11:45"},
  {id:17,text:"12:00"},{id:18,text:"12:15"},{id:19,text:"12:30"},{id:20,text:"12:45"},
  {id:21,text:"13:00"},{id:22,text:"13:15"},{id:23,text:"13:30"},{id:24,text:"13:45"},
  {id:25,text:"14:00"},{id:26,text:"14:15"},{id:27,text:"14:30"},{id:28,text:"14:45"},
  {id:29,text:"15:00"},{id:30,text:"15:15"},{id:31,text:"15:30"},{id:32,text:"15:45"},
  {id:33,text:"16:00"}
];

function todayISO() {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function formatDateNice(iso) {
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
function now12h() {
  return new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
}
function parseSheetDate(val) {
  if (!val) return null;
  if (typeof val==="string" && val.match(/^\d{4}-\d{2}-\d{2}/)) return val.substring(0,10);
  if (typeof val==="number") {
    const d=new Date((val-25569)*86400000);
    return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
  }
  const d=new Date(val);
  if (!isNaN(d)) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return null;
}
function timeToSlotId(t) {
  if (!t) return 0;
  const v=String(t).trim();
  if (!isNaN(v)&&v.includes(".")) {
    const m=Math.round(parseFloat(v)*24*60),h=Math.floor(m/60),mn=m%60;
    return Math.max(1,Math.floor(((h-8)*60+mn)/15)+1);
  }
  const c=v.replace(/\s*(AM|PM)/i,""),p=c.split(":");
  let h=parseInt(p[0]);const mn=parseInt(p[1])||0;
  if (/PM/i.test(v)&&h<12) h+=12;
  if (/AM/i.test(v)&&h===12) h=0;
  return Math.max(1,Math.floor(((h-8)*60+mn)/15)+1);
}
function parseCSV(text) {
  const rows=[];let row=[],cur="",inQ=false;
  for (let i=0;i<text.length;i++) {
    const c=text[i];
    if (inQ) { if(c==='"'&&text[i+1]==='"'){cur+='"';i++;}else if(c==='"')inQ=false;else cur+=c; }
    else { if(c==='"')inQ=true;else if(c===','){row.push(cur);cur="";}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}else if(c!=='\r')cur+=c; }
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}

function getStatusClass(raw) {
  if (!raw) return "pending";
  const v = raw.trim().toLowerCase();
  if (v === "completed") return "completed";
  if (v === "in progress") return "inprogress";
  return "pending";
}
function getStatusLabel(raw) {
  if (!raw) return "Pending";
  const v = raw.trim().toLowerCase();
  if (v === "completed") return "Completed";
  if (v === "in progress") return "In Progress";
  return "Pending";
}

async function fetchAppointments(dateStr) {
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Appointments`;
  const resp=await fetch(url);
  if(!resp.ok) throw new Error(`Sheet fetch failed: ${resp.status}`);
  const csv=await resp.text();
  const rows=parseCSV(csv);
  if(rows.length<2) return [];
  const headers=rows[0].map(h=>h.trim());
  const idx=h=>headers.indexOf(h);
  const iDir=idx("Inbound / Outbound"),iDate=idx("Scheduled Date"),iDoor=idx("Door");
  const iCarrier=idx("Carrier"),iPartner=idx("Partner"),iStatus=idx("Status");
  const iStart=idx("StartTimeSlot"),iEnd=idx("EndTimeSlot");
  const iStartT=idx("StartTime"),iEndT=idx("EndTime");
  const iProcStatus=idx("DP__ProcessingStatus");
  return rows.slice(1).filter(r=>parseSheetDate(r[iDate])===dateStr).map(r=>({
    direction:r[iDir]||"",door:r[iDoor]||"",carrier:r[iCarrier]||"",
    partner:r[iPartner]||"",status:r[iStatus]||"",
    startSlot:parseInt(r[iStart])||0,endSlot:parseInt(r[iEnd])||0,
    startTime:r[iStartT]||"",endTime:r[iEndT]||"",
    processingStatus: iProcStatus >= 0 ? (r[iProcStatus]||"") : ""
  }));
}

function buildGridShell() {
  const thead=document.getElementById("table-head");
  const tbody=document.getElementById("table-body");
  const htr=document.createElement("tr");
  const thT=document.createElement("th");thT.className="col-time";thT.textContent="TIME";htr.appendChild(thT);
  DOORS.forEach(d=>{const th=document.createElement("th");th.className="col-door";th.textContent=d;htr.appendChild(th);});
  thead.appendChild(htr);
  SLOTS.forEach(slot=>{
    const tr=document.createElement("tr");tr.id="row-"+slot.id;
    if(slot.text.endsWith(":00"))tr.classList.add("hour-mark");
    const tdT=document.createElement("td");tdT.className="time-label";tdT.textContent=slot.text;tr.appendChild(tdT);
    DOORS.forEach(door=>{const td=document.createElement("td");td.id="cell-"+slot.id+"-"+door.replace(/\s/g,"");tr.appendChild(td);});
    tbody.appendChild(tr);
  });
}

function clearGrid() {
  document.querySelectorAll("td[id^='cell-']").forEach(td=>{
    td.innerHTML="";td.style.background="";td.style.borderLeft="";
    td.style.backgroundImage="";td.style.padding="2px";td.className="";
  });
}

function renderAppointments(appointments) {
  clearGrid();
  const painted=new Set();
  appointments.forEach(appt=>{
    let s=appt.startSlot,e=appt.endSlot;
    if(!s&&appt.startTime)s=timeToSlotId(appt.startTime);
    if(!e&&appt.endTime)e=timeToSlotId(appt.endTime);
    if(!s)return;if(!e||e<=s)e=s+1;
    const door=appt.door,dir=appt.direction.trim();
    const cancelled=appt.status.toLowerCase().includes("cancel");
    const dk=door.replace(/\s/g,""),spans=Math.max(1,e-s);
    const stClass=getStatusClass(appt.processingStatus);
    const stLabel=getStatusLabel(appt.processingStatus);
    for(let i=s;i<s+spans&&i<=33;i++){
      const cid="cell-"+i+"-"+dk;if(painted.has(cid))continue;painted.add(cid);
      const td=document.getElementById(cid);if(!td)continue;
      if(i===s){
        const isIn=dir==="Inbound";
        const bc=cancelled?"appt appt-cancelled":(isIn?"appt appt-inbound":"appt appt-outbound");
        td.style.padding="2px";
        td.innerHTML='<div class="'+bc+'">'
          +'<div class="appt-dir">'+(cancelled?"Cancelled":dir)+'</div>'
          +'<div class="appt-carrier">'+(appt.carrier||"—")+'</div>'
          +(appt.partner?'<div class="appt-partner">'+appt.partner+'</div>':"")
          +(cancelled?"":'<div class="appt-status status-'+stClass+'">'+stLabel+'</div>')
          +'</div>';
      } else {
        const bg=cancelled?"#c0392b":(dir==="Inbound"?"#1E6CB8":"#1e8c4a");
        const bd=cancelled?"#922b21":(dir==="Inbound"?"#0d3d6e":"#0d4a25");
        td.style.background=bg;
        td.style.borderLeft="5px solid "+bd;
        td.style.padding="0";
        if(!cancelled){
          if(stClass==="inprogress") td.style.backgroundImage="repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(243,156,18,0.3) 6px,rgba(243,156,18,0.3) 12px)";
          else if(stClass==="completed") td.style.backgroundImage="repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(39,174,96,0.3) 6px,rgba(39,174,96,0.3) 12px)";
        }
      }
    }
  });
}

async function load() {
  const bar=document.getElementById("status-bar");bar.style.width="50%";
  const dateStr=todayISO();
  document.getElementById("date-display").textContent=formatDateNice(dateStr);
  try {
    const appts=await fetchAppointments(dateStr);
    renderAppointments(appts);
    const pending=appts.filter(a=>getStatusClass(a.processingStatus)==="pending"&&!a.status.toLowerCase().includes("cancel")).length;
    const inprog=appts.filter(a=>getStatusClass(a.processingStatus)==="inprogress").length;
    const done=appts.filter(a=>getStatusClass(a.processingStatus)==="completed").length;
    document.getElementById("last-updated").textContent=
      "Updated "+now12h()+" \u00b7 "+appts.length+" appt"+(appts.length!==1?"s":"")
      +" \u00b7 "+done+" done \u00b7 "+inprog+" in progress \u00b7 "+pending+" pending";
    document.getElementById("error-msg").style.display="none";
  } catch(e) {
    const em=document.getElementById("error-msg");em.textContent="Could not load schedule: "+e.message;em.style.display="block";console.error(e);
  }
  bar.style.width="100%";setTimeout(()=>{bar.style.width="0%";},600);
  document.getElementById("loading").style.display="none";
}

buildGridShell();load();setInterval(load,REFRESH_MS);
</script>
</body>
</html>
